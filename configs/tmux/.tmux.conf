# Cyberdeck Fallout tmux config

set -g mouse on
set -g history-limit 100000
set -sg escape-time 0
set -g default-terminal "screen-256color"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Colors - Fallout green
set -g status-style fg=green,bg=black
set -g message-style fg=green,bg=black
set -g message-command-style fg=green,bg=black
set -g pane-border-style fg=green
set -g pane-active-border-style fg=brightgreen
set -g mode-style fg=black,bg=green

# Status bar
set -g status-interval 5
set -g status-justify left
set -g status-left-length 50
set -g status-right-length 100

set -g status-left '#[fg=brightgreen,bg=black,bold] VAULT-TEC #[fg=green,bg=black]#S '
set -g status-right '#[fg=green,bg=black]#(whoami)@#H #[fg=brightgreen]| %Y-%m-%d %H:%M '

# Windows
setw -g window-status-format '#[fg=green,bg=black] #I:#W '
setw -g window-status-current-format '#[fg=black,bg=green,bold] #I:#W '
setw -g window-status-activity-style fg=brightgreen,bg=black

# Easier new sessions/windows
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Default shell behavior
set -g detach-on-destroy off
set -g aggressive-resize on
